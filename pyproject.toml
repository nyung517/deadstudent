[project]
name = "deadstudent"
version = "0.1.0"
description = "Dropout-risk screening model for a limited advising budget"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.3",
    "scikit-learn==1.5.2",
    "matplotlib==3.10.6",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
